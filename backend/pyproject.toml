[project]
name = "rounds-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "boto3>=1.43",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=9.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]

[tool.uv]
package = false

# Lets `pip install -e .` install the dependencies without packaging the app folders.
[tool.setuptools]
packages = []
