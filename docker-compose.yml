services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rounds
      POSTGRES_PASSWORD: rounds  # local development only
      POSTGRES_DB: rounds
    ports:
      - "5433:5432"  # 5433 so it does not clash with a Postgres already on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rounds"]
      interval: 3s
      retries: 10

volumes:
  pgdata:
