AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  [Product name] sign-in (PRD P-04), stack 4 of 5. Cognito user pool with faculty and student
  groups, managed login, email + password, optional Google and optional email one-time codes.
  Needs the edge stack for callback URLs.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    why: Cognito is used for sign-in only (AGENTS.md). Separate stack so sign-in settings change without touching compute.
    must:
      - Replacing the user pool deletes every user account; avoid changes that require replacement.
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Sign-in }
        Parameters: [CognitoDomainPrefix, GoogleClientId, GoogleClientSecret, SesIdentityArn, SesFromAddress]

Parameters:
  Prefix:
    Type: String
    Default: rounds-dev
    AllowedPattern: '^[a-z][a-z0-9-]{1,30}$'
    Description: Shared name prefix; must match the network stack.
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: '^[a-z0-9](?:[a-z0-9\-]{0,61}[a-z0-9])?$'
    Description: Globally unique prefix for the sign-in pages (<prefix>.auth.<region>.amazoncognito.com).
  GoogleClientId:
    Type: String
    Default: ""
    Description: Optional Google OAuth client ID. Leave blank to skip Google sign-in.
  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Google OAuth client secret. Required when GoogleClientId is set.
  SesIdentityArn:
    Type: String
    Default: ""
    Description: >-
      Optional ARN of a verified SES identity in this region. Email one-time-password sign-in
      needs it; leave blank to offer password sign-in only.
  SesFromAddress:
    Type: String
    Default: ""
    Description: From address for Cognito email when SesIdentityArn is set (must belong to that identity).

Conditions:
  HasGoogle: !Not [!Equals [!Ref GoogleClientId, ""]]
  HasSes: !Not [!Equals [!Ref SesIdentityArn, ""]]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Sign-in for faculty and students. Essentials tier is needed for choice-based sign-in
          (password or email code); it is free under 10,000 monthly active users.
        must:
          - Email OTP only works with an SES identity; without one the pool uses Cognito's default email and password sign-in.
    Properties:
      UserPoolName: !Sub "${Prefix}-users"
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration: { CaseSensitive: false }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: false }
      DeletionProtection: INACTIVE
      EmailConfiguration: !If
        - HasSes
        - EmailSendingAccount: DEVELOPER
          SourceArn: !Ref SesIdentityArn
          From: !Ref SesFromAddress
        - EmailSendingAccount: COGNITO_DEFAULT
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
        SignInPolicy:
          AllowedFirstAuthFactors: !If [HasSes, [PASSWORD, EMAIL_OTP], [PASSWORD]]
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  FacultyGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: faculty
      Description: Case authors; can use the Patient Studio and the class dashboard
      Precedence: 1

  StudentGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: student
      Description: Learners; can run encounters and see their own debriefs
      Precedence: 2

  GoogleIdp:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Metadata:
      com.aws.cloudformation.Context:
        why: Managed login (version 2) is required for passwordless sign-in and Google redirects.
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref CognitoDomainPrefix
      ManagedLoginVersion: 2

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Metadata:
      com.aws.cloudformation.Context:
        why: Public SPA client; authorization code flow with PKCE, so no client secret.
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_AUTH, ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: !If [HasGoogle, [COGNITO, !Ref GoogleIdp], [COGNITO]]
      CallbackURLs:
        - !Sub
          - "https://${Domain}/auth/callback"
          - Domain: { "Fn::ImportValue": !Sub "${Prefix}-DistributionDomainName" }
        - http://localhost:5173/auth/callback
      LogoutURLs:
        - !Sub
          - "https://${Domain}/"
          - Domain: { "Fn::ImportValue": !Sub "${Prefix}-DistributionDomainName" }
        - http://localhost:5173/
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 7
      TokenValidityUnits: { AccessToken: hours, IdToken: hours, RefreshToken: days }

  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref WebClient
      UseCognitoProvidedValues: true

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export: { Name: !Sub "${Prefix}-UserPoolArn" }
  UserPoolClientId:
    Value: !Ref WebClient
  CognitoDomain:
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  GoogleRedirectUri:
    Description: Add this as an authorized redirect URI in the Google OAuth client
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
