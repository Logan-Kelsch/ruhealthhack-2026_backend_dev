AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  [Product name] data (PRD P-04), stack 2 of 5. RDS Postgres (one database shared by the
  deployed app and team laptops) and the private media bucket for encounter audio and case
  images. Needs the network stack.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    why: >-
      Stateful resources sit in their own stack so the compute, CDN and sign-in stacks can be
      changed or rebuilt without touching the database or recordings.
    must:
      - Deleting this stack snapshots RDS and leaves the media bucket behind on purpose.
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Database }
        Parameters: [DBInstanceClass, DBName, DBUsername, DBPassword]

Parameters:
  Prefix:
    Type: String
    Default: rounds-dev
    AllowedPattern: '^[a-z][a-z0-9-]{1,30}$'
    Description: Shared name prefix; must match the network stack.
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium]
    Description: >-
      AWS free plan accounts only allow micro classes. Move to db.t4g.small after upgrading
      the account plan if the database becomes the bottleneck.
  DBName:
    Type: String
    Default: rounds
    AllowedPattern: '^[a-z][a-z0-9_]{0,62}$'
  DBUsername:
    Type: String
    Default: rounds
    AllowedPattern: '^[a-z][a-z0-9_]{0,15}$'
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    AllowedPattern: '^[A-Za-z0-9_\-]+$'
    ConstraintDescription: 16+ characters, letters, digits, _ or - (keeps DATABASE_URL free of escaping).
    Description: RDS master password. Put the same value in .env on the instance.

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Encounter audio and case images (PRD S3_BUCKET). Recordings are kept for feedback replay.
        must:
          - Stays private; the browser only gets presigned URLs from the backend.
          - Retained on stack delete; empty and delete it by hand after the event.
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
      CorsConfiguration:
        CorsRules:
          # Wildcard because this stack deploys before the distribution exists.
          - AllowedMethods: [GET, PUT]
            AllowedOrigins: ["https://*.cloudfront.net", "http://localhost:5173"]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt MediaBucket.Arn, !Sub "${MediaBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Public subnets; access is limited by security groups
      SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${Prefix}-DbSubnetIds" }]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Postgres for cases (JSONB), encounters and turns. Single-AZ burstable to fit the budget.
          One database serves both the deployed app and every teammate's laptop, so data is
          shared during development.
        must:
          - Publicly addressable, but only the backend and single team IPs may connect; TLS is required (rds.force_ssl is on by default for Postgres 15+).
          - A final snapshot is taken on delete; remove it by hand when no longer needed.
      cfn-lint:
        config:
          ignore_checks: [W1011]  # team chose .env on the box over Secrets Manager; the parameter is NoEcho
    Properties:
      Engine: postgres
      EngineVersion: "17.11"
      DBInstanceClass: !Ref DBInstanceClass
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      AllocatedStorage: "20"  # free plan limit; no storage autoscaling for the same reason
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - { "Fn::ImportValue": !Sub "${Prefix}-DbSecurityGroupId" }
        - { "Fn::ImportValue": !Sub "${Prefix}-DbDevAccessSecurityGroupId" }
      BackupRetentionPeriod: 1
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      CopyTagsToSnapshot: true

Outputs:
  MediaBucketName:
    Description: Set S3_BUCKET to this in .env
    Value: !Ref MediaBucket
  MediaBucketArn:
    Value: !GetAtt MediaBucket.Arn
    Export: { Name: !Sub "${Prefix}-MediaBucketArn" }
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseUrlTemplate:
    Description: DATABASE_URL for the shared .env (replace PASSWORD)
    Value: !Sub "postgresql+psycopg://${DBUsername}:PASSWORD@${Database.Endpoint.Address}:5432/${DBName}?sslmode=require"
