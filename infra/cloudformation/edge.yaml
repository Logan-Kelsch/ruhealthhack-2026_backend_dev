AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  [Product name] edge (PRD P-04), stack 3 of 5. Private S3 bucket for the React build and one
  CloudFront distribution that serves it and forwards /api/* (including WebSockets) to the
  backend's Elastic IP. Needs the network stack.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    why: >-
      CloudFront is the only public HTTPS entry point, which gives the browser one origin (no
      CORS, a secure context for the microphone) without paying for an ALB or a custom domain.
    must:
      - Route 53 and ACM are left out until the team has a domain.
      - The auth stack imports DistributionDomainName for Cognito callback URLs.

Parameters:
  Prefix:
    Type: String
    Default: rounds-dev
    AllowedPattern: '^[a-z][a-z0-9-]{1,30}$'
    Description: Shared name prefix; must match the network stack.

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Metadata:
      com.aws.cloudformation.Context:
        why: Compiled React build. Reproducible from source, so no versioning and no retention.
        must:
          - Must be emptied before the stack can be deleted.
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt FrontendBucket.Arn, !Sub "${FrontendBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  FrontendOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${Prefix}-frontend"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Client-side routes (/encounter/123) must return index.html. Done per-behavior rather than
          with custom error responses, which would also rewrite real 404s from /api/*.
    Properties:
      Name: !Sub "${Prefix}-spa-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for paths without a file extension
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          if (!req.uri.split('/').pop().includes('.')) {
            req.uri = '/index.html';
          }
          return req;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      com.aws.cloudformation.Context:
        why: Single HTTPS entry point. Default behavior serves the SPA; /api/* goes to EC2 uncached.
        must:
          - /api/* must stay uncached and forward all viewer headers (WebSocket upgrade, Authorization).
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${Prefix} frontend + API"
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOac.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: { "Fn::ImportValue": !Sub "${Prefix}-AppOriginDomain" }
            CustomOriginConfig:
              HTTPPort: { "Fn::ImportValue": !Sub "${Prefix}-AppPort" }
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  SiteUrl:
    Description: Public URL for the app (frontend and /api)
    Value: !Sub "https://${Distribution.DomainName}"
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
    Export: { Name: !Sub "${Prefix}-DistributionDomainName" }
  FrontendBucketName:
    Value: !Ref FrontendBucket
